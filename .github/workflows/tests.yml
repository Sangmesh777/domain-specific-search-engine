name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # The parity gates read historical revisions of app.py with
          # `git show`, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the verification gate
        run: ./run_tests.sh
